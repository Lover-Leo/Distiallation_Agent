<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的表达 · 本地基线</title>
<style>body{font:16px system-ui;background:#f5f7fa;color:#1c2e3e;max-width:900px;margin:45px auto;padding:20px}h1{font-size:30px}.note,small{color:#566574}section,article{background:white;border:1px solid #e0e5ea;border-radius:12px;padding:20px;margin:16px 0}p.text{white-space:pre-wrap;overflow-wrap:anywhere}textarea{width:95%;height:80px;padding:12px;font:inherit;border:1px solid #bac7d1;border-radius:8px}button{font:inherit;background:#245664;color:white;padding:10px 24px;border:0;border-radius:8px;cursor:pointer}#status{min-height:25px}dt{display:inline-block;margin-right:12px}dd{display:inline;margin:0}details{font-size:13px;overflow-wrap:anywhere}</style>
<h1>我的表达 · 本地基线</h1><p class="note">真实历史检索与表达统计。尚未接入生成模型，不代表本人当前观点。仅此联系人场景。</p>
<section><h2>训练部分的表达统计</h2><div id="profile">正在读取…</div></section>
<section><h2>查找回应示例</h2><form><textarea maxlength="2000" required aria-label="输入聊天情境" placeholder="输入一句对方可能说的话，查找相似历史情境"></textarea><p><button>检索</button></p></form><p class="note">查询仅在本机执行，不保存输入。验证集与测试集不参与检索。</p></section>
<p id="status" role="status"></p><main id="results"></main>
<script>
const profile=document.querySelector('#profile'),results=document.querySelector('#results'),status=document.querySelector('#status');
fetch('/api/profile').then(r=>{if(!r.ok)throw Error();return r.json()}).then(p=>{profile.textContent=`基于 ${p.targetMessages.toLocaleString()} 条训练部分本人消息；平均 ${p.meanCharacters.toFixed(1)} 字，中位数 ${p.medianCharacters} 字，90% 不超过 ${p.p90Characters} 字。`;for(const m of p.metrics){const line=document.createElement('p');line.textContent=`${m.label}：${(m.rate*100).toFixed(1)}%`;profile.append(line);}}).catch(()=>profile.textContent='统计读取失败。');
document.querySelector('form').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button'),message=e.target.querySelector('textarea').value.trim();if(!message)return;button.disabled=true;results.replaceChildren();status.textContent='检索中…';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message}),signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error();const data=await r.json();status.textContent=data.evidence.length?data.reply:'没有匹配示例。';for(const item of data.evidence){const article=document.createElement('article');for(const [label,text] of [['日期',item.day],['当时的前文',item.context],['我当时的回复',item.text]]){const h=document.createElement('strong');h.textContent=label;const p=document.createElement('p');p.className='text';p.textContent=text;article.append(h,p);}const details=document.createElement('details'),summary=document.createElement('summary'),p=document.createElement('p');summary.textContent='查看来源';p.textContent=JSON.stringify({sample:item.id,messages:item.sources},null,2);details.append(summary,p);article.append(details);results.append(article);}}catch{status.textContent='检索失败，请确认本地服务正在运行。';}finally{button.disabled=false;}};
</script></html>
