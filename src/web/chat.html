<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的表达 · AI 模拟聊天</title>
<style>
:root{font:16px "Microsoft YaHei UI","PingFang SC",sans-serif;color:#203d37;background:#e9efeb;--ink:#203d37;--muted:#72837b;--line:#dfe7e1;--green:#285e4b}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}button,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid #4b8267;outline-offset:3px}
.app{height:100vh;height:100dvh;max-width:1120px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;background:#f7f9f5;border-inline:1px solid var(--line)}.app>*{min-width:0}
.app-header{padding:18px 30px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fcfdf9;border-bottom:1px solid var(--line)}h1{font-size:22px;letter-spacing:.02em;margin:0;font-weight:650;display:flex;align-items:center;gap:10px}.badge{font-size:11px;font-weight:500;padding:4px 7px;color:var(--green);background:#e4ede2;border-radius:4px;letter-spacing:.04em}.tagline{margin:4px 0 0;font-size:12px;color:var(--muted)}
.connection-wrap{display:flex;gap:12px;align-items:center}#connection{font-size:12px;color:#577261;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.quiet{border:1px solid var(--line);color:#596e60;background:transparent;padding:7px 11px;border-radius:7px;font-size:13px}.quiet:hover{background:#edf3eb}.toolbar{padding:12px 30px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);background:#fcfdf9}.select-label{font-size:12px;color:var(--muted);margin-right:2px}select{min-width:0;width:260px;max-width:40vw;border:1px solid var(--line);background:white;color:var(--ink);border-radius:7px;padding:8px 10px;font-size:14px;text-overflow:ellipsis}.toolbar #new{background:var(--green);color:white;border-color:var(--green)}.toolbar #delete{margin-left:auto}
.conversation{position:relative;min-height:0;display:flex}#history{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#bccbbf transparent;padding:26px 38px 30px;scroll-padding-bottom:25px}.message-list{max-width:800px;margin:auto;min-height:100%;display:flex;flex-direction:column;gap:18px}.message{display:flex;flex-direction:column;align-items:flex-start}.message.user{align-items:flex-end}.message small{font-size:11px;color:var(--muted);margin:0 6px 6px}.bubble{max-width:min(82%,620px);padding:12px 16px;border:1px solid #e2e8e0;background:#fff;border-radius:3px 15px 15px 15px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.75;font-size:15px;margin:0}.user .bubble{background:#e0ebdc;border-color:#dce7d7;border-radius:15px 3px 15px 15px}.pending .bubble{color:var(--muted);font-size:13px}.empty-state{margin:auto;text-align:center;color:var(--muted);padding:24px}.empty-state strong{display:block;color:#435d4b;font-size:20px;font-weight:500;margin-bottom:10px}.empty-state p{font-size:13px}.jump{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);box-shadow:0 3px 16px #244e341a;background:#fff;border:1px solid var(--line);border-radius:22px;padding:8px 16px;color:var(--green);font-size:12px}.jump[hidden]{display:none}
.composer-area{background:#fcfdf9;border-top:1px solid var(--line);padding:14px 30px max(12px,env(safe-area-inset-bottom));min-width:0}.composer{max-width:800px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end;border:1px solid #cddace;background:white;border-radius:12px;padding:10px 12px}.composer:focus-within{border-color:#87a590;box-shadow:0 0 0 2px #87a59012}textarea{width:100%;height:58px;min-height:40px;max-height:100px;resize:none;border:0;background:transparent;outline:none!important;padding:6px 4px;color:var(--ink);line-height:1.5;font-size:15px;overflow-y:auto}#send{background:var(--green);color:white;border:0;border-radius:8px;padding:10px 18px;margin-bottom:2px;white-space:nowrap}.composer-meta{max-width:800px;margin:8px auto 0;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:16px;color:var(--muted);font-size:11px}.keyboard-hint{white-space:nowrap}.source-button{border:0;background:none;color:#617c69;padding:0;font-size:11px}.notice{max-width:800px;margin:0 auto;line-height:1.4;font-size:12px}#status:not(:empty),#error:not(:empty){margin:0 auto 8px}#status{color:#5b795f}#error{color:#a33d36;max-height:48px;overflow:auto}
dialog{border:1px solid var(--line);border-radius:16px;padding:24px;width:min(520px,calc(100vw - 32px));max-height:75dvh;overflow:auto;color:var(--ink);box-shadow:0 18px 80px #17382320}dialog::backdrop{background:#19352c4d}dialog header{display:flex;align-items:center;justify-content:space-between;gap:16px}dialog h2{font-size:18px;font-weight:600;margin:0}dialog p{font-size:14px;line-height:1.9;color:#5e7265}#sources{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.source-empty{color:var(--muted)}
@media(max-width:600px){.app-header{padding:13px 16px}h1{font-size:19px}.tagline{display:none}.connection-wrap{gap:6px}#connection{max-width:90px;font-size:10px}.quiet{padding:7px 9px;font-size:12px}.toolbar{padding:10px 16px;gap:6px}.select-label{display:none}select{width:auto;flex:1;max-width:none;font-size:12px;padding:8px 5px}.toolbar #delete{margin-left:0}#history{padding:20px 16px}.message-list{gap:16px}.bubble{max-width:90%;padding:10px 13px;font-size:14px}.composer-area{padding:10px 12px max(10px,env(safe-area-inset-bottom))}.composer{gap:8px;padding:8px}textarea{font-size:16px;height:48px}#send{padding:10px 14px}.keyboard-hint{display:none}.composer-meta{font-size:10px;gap:6px}.badge{font-size:10px}}
@media(max-height:480px){.app-header{padding-block:8px}.toolbar{padding-block:6px}.tagline{display:none}.composer-area{padding-block:7px}textarea{height:40px}.composer-meta{margin-top:5px}}
</style>
<div class="app">
<header class="app-header"><div><h1>我的表达 <span class="badge">AI 模拟</span></h1><p class="tagline">延续你的表达习惯，聊聊此刻。</p></div><div class="connection-wrap"><span id="connection">正在连接…</span><button class="quiet" id="about" type="button">使用说明</button></div></header>
<nav class="toolbar" aria-label="会话管理"><span class="select-label">会话</span><select id="sessions" aria-label="切换会话"></select><button class="quiet" id="new" type="button">新会话</button><button class="quiet" id="clear" type="button">清空</button><button class="quiet" id="delete" type="button">删除</button></nav>
<div class="conversation"><main id="history" aria-label="聊天记录" tabindex="0"><div class="message-list" id="messages" role="log" aria-live="polite" aria-relevant="additions"></div></main><button class="jump" id="jump" hidden type="button">回到最新 ↓</button></div>
<footer class="composer-area"><p class="notice" id="status" role="status"></p><p class="notice" id="error" role="alert"></p><form class="composer"><textarea rows="2" maxlength="2000" required aria-label="输入聊天消息" placeholder="聊点什么…"></textarea><button id="send" disabled>发送 ↑</button></form><div class="composer-meta"><span>AI 生成，不代表本人实时观点。<span class="keyboard-hint"> Enter 发送 · Shift+Enter 换行</span></span><button class="source-button" id="show-sources" type="button">本次参考来源 ↗</button></div></footer>
</div>
<dialog id="about-dialog" aria-labelledby="about-title"><header><h2 id="about-title">关于这段对话</h2><button type="button" class="quiet" data-close>关闭</button></header><p>基于你与一位联系人的文字风格生成，不代表本人实时观点。</p><p>发送消息后，当前输入、最多 6 轮本次会话、表达统计和最多 3 个训练集历史片段会发送至 DeepSeek。</p><p>会话保存在本机服务内存，刷新页面可恢复；服务停止后消失。输入框支持 Enter 发送，Shift+Enter 换行。</p></dialog>
<dialog id="sources-dialog" aria-labelledby="sources-title"><header><h2 id="sources-title">本次参考来源</h2><button type="button" class="quiet" data-close>关闭</button></header><p id="sources">发送消息后显示参考样本的日期及编号。</p></dialog>
<script>
const $=selector=>document.querySelector(selector);
const select=$('#sessions'),history=$('#history'),list=$('#messages'),input=$('textarea'),status=$('#status'),error=$('#error'),sources=$('#sources'),jump=$('#jump');
let active=null,ready=false,busy=false,composing=false;
const nearBottom=()=>history.scrollHeight-history.scrollTop-history.clientHeight<80;
function updateJump(){jump.hidden=nearBottom();}
function bottom(){history.scrollTop=history.scrollHeight;updateJump();}
history.addEventListener('scroll',updateJump,{passive:true});jump.onclick=bottom;
const observer=new ResizeObserver(()=>{updateJump();});observer.observe(history);
for(const [button,dialog] of [['#about','#about-dialog'],['#show-sources','#sources-dialog']])$(button).onclick=()=>$(dialog).showModal();
for(const button of document.querySelectorAll('[data-close]'))button.onclick=()=>button.closest('dialog').close();
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(130000)});const data=await r.json();if(!r.ok)throw Error(data.error||'请求失败');return data;}
function controls(value){busy=value;for(const id of ['#new','#clear','#delete','#sessions'])$(id).disabled=value;$('#send').disabled=value||!ready;input.readOnly=value;$('#send').textContent=value?'等待…':'发送 ↑';}
function emptyState(){if(!list.children.length){const empty=document.createElement('div');empty.className='empty-state';const title=document.createElement('strong'),hint=document.createElement('p');title.textContent='从一句日常开始';hint.textContent='说说今天，或接着上次的话题。';empty.append(title,hint);list.append(empty);}}
function bubble(role,content,pending=false){list.querySelector('.empty-state')?.remove();const row=document.createElement('article'),label=document.createElement('small'),p=document.createElement('p');row.className='message '+role+(pending?' pending':'');label.textContent=role==='user'?'你':'AI 模拟';p.className='bubble';p.textContent=content;row.append(label,p);list.append(row);return row;}
async function render(){list.replaceChildren();status.textContent='';sources.textContent='发送消息后显示本次参考来源。';if(active){const data=await api('/api/sessions/'+active);for(const m of data.messages)bubble(m.role,m.content);}emptyState();bottom();}
async function refresh(){const items=await api('/api/sessions');select.replaceChildren();for(const s of items){const o=document.createElement('option');o.value=s.id;o.textContent=s.title;select.append(o);}if(!items.some(s=>s.id===active))active=items.at(-1)?.id||null;select.value=active||'';}
async function create(){const data=await api('/api/sessions','POST');active=data.id;await refresh();await render();}
async function action(fn){if(busy)return;controls(true);error.textContent='';try{await fn();}catch(e){error.textContent=e.message;}finally{controls(false);}}
$('#new').onclick=()=>action(async()=>{await create();input.focus();});
select.onchange=()=>action(async()=>{active=select.value;await render();});
$('#clear').onclick=()=>action(async()=>{await api('/api/sessions/'+active+'/clear','POST');await refresh();await render();});
$('#delete').onclick=()=>action(async()=>{await api('/api/sessions/'+active,'DELETE');await refresh();if(!active)await create();else await render();});
input.addEventListener('compositionstart',()=>composing=true);input.addEventListener('compositionend',()=>composing=false);
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&!composing&&e.keyCode!==229){e.preventDefault();if(!busy&&ready)$('form').requestSubmit();}});
$('form').onsubmit=e=>{e.preventDefault();const message=input.value.trim();if(!message||busy||!ready)return;action(async()=>{
  if(!active)await create();status.textContent='';const userRow=bubble('user',message),pending=bubble('assistant','正在回复…',true);bottom();
  try{const data=await api('/api/generate','POST',{message,session_id:active});const follow=nearBottom();pending.remove();bubble('assistant',data.reply);input.value='';while(list.querySelectorAll('.message').length>100)list.querySelector('.message').remove();await refresh();sources.textContent=data.evidence.length?data.evidence.map(s=>s.day+' · '+s.id).join('\n'):'本次没有匹配的历史示例。';status.textContent=data.truncated?'回复达到长度上限，可继续询问。':data.contextLimited?'本次参考了最近的部分对话。':'';if(follow)bottom();else updateJump();input.focus();}
  catch(e){const follow=nearBottom();pending.remove();userRow.remove();emptyState();if(follow)bottom();throw e;}
});};
action(async()=>{const config=await api('/api/status');ready=config.ready;$('#connection').textContent=ready?'DeepSeek 已连接':'密钥待配置';$('#connection').title=ready?config.model:'请运行本地密钥配置脚本并重启服务';if(!ready)error.textContent='尚未配置密钥，请运行本地密钥配置脚本并重启服务。';await refresh();if(!active)await create();else await render();});
</script></html>
